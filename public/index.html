<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Interfaz de Aviónica - ARINC 429</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1, h2 { color: #4CAF50; border-bottom: 2px solid #333; padding-bottom: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 10px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #4CAF50; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #45a049; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #444; padding: 10px; text-align: left; }
        th { background: #2d2d2d; }
        .btn-delete { background: #d32f2f; padding: 5px 10px; }
        .btn-delete:hover { background: #b71c1c; }
        .btn-edit { background: #1976d2; padding: 5px 10px; margin-right: 5px; }
        .btn-edit:hover { background: #1565c0; }
        #cancelar-edicion { background: #666; margin-left: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Panel de Control de Aviónica (ARINC 429)</h1>
        
        <div class="form-group">
            <label for="instrumento">Seleccionar Instrumento:</label>
            <select id="instrumento">
                <option value="1 - Avisos">1 - Avisos (Label 043)</option>
                <option value="2 - Altímetro">2 - Altímetro (Label 203)</option>
                <option value="3 - Velocímetro">3 - Velocímetro (Label 212)</option>
                <option value="4 - Tacómetro (RPM)">4 - Tacómetro (Label 044)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="valor">Valor de Entrada:</label>
            <input type="number" id="valor" step="0.1" placeholder="Ej: 105.5">
        </div>

        <button id="boton-principal" onclick="enviarDato()">Procesar y Enviar Trama</button>
        <button id="cancelar-edicion" onclick="cancelarEdicion()" hidden>Cancelar edición</button>

        <h2>Registros en Base de Datos</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Instrumento</th>
                    <th>Valor</th>
                    <th>Máx / Mín</th>
                    <th>Fecha</th>
                    <th>Acción</th>
                </tr>
            ​</thead>
            <tbody id="tabla-cuerpo">
                <!-- Se llena dinámicamente -->
            </tbody>
        </table>
    </div>

    <script>
        let envioEnEdicion = null;

        async function cargarEnvios() {
            const tbody = document.getElementById('tabla-cuerpo');
            tbody.innerHTML = '';

            try {
                const res = await fetch('/api/envios');
                const datos = await res.json();
                if (!res.ok || !Array.isArray(datos)) {
                    throw new Error(datos.error || 'La API no devolvió una lista de envíos.');
                }
            
                datos.forEach(item => {
                    const tr = document.createElement('tr');
                    [item.id, item.instrumento, item.valor, `${item.maximo} / ${item.minimo}`, new Date(item.fecha_creacion).toLocaleString()].forEach(valor => {
                        const td = document.createElement('td');
                        td.textContent = valor;
                        tr.appendChild(td);
                    });

                    const acciones = document.createElement('td');
                    const botonEditar = document.createElement('button');
                    botonEditar.className = 'btn-edit';
                    botonEditar.textContent = 'Editar';
                    botonEditar.addEventListener('click', () => editarEnvio(item.id, item.instrumento, item.valor));
                    const botonEliminar = document.createElement('button');
                    botonEliminar.className = 'btn-delete';
                    botonEliminar.textContent = 'Eliminar';
                    botonEliminar.addEventListener('click', () => eliminarEnvio(item.id));
                    acciones.append(botonEditar, botonEliminar);
                    tr.appendChild(acciones);
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error al cargar los envíos:', error);
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = 6;
                td.textContent = `No se pudieron cargar los envíos: ${error.message}`;
                tr.appendChild(td);
                tbody.appendChild(tr);
            }
        }

        async function enviarDato() {
            const instrumento = document.getElementById('instrumento').value;
            const valor = document.getElementById('valor').value;

            if (valor === '' || !Number.isFinite(Number(valor))) {
                alert('Por favor ingrese un valor.');
                return;
            }

            if (envioEnEdicion !== null) {
                const res = await fetch(`/api/envios/${envioEnEdicion}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ instrumento, valor })
                });
                const resultado = await res.json();
                if (resultado.success) {
                    cancelarEdicion();
                    await cargarEnvios();
                } else {
                    alert(resultado.error || 'No se pudo actualizar el envío.');
                }
                return;
            }

            const res = await fetch('/api/envios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ instrumento, valor })
            });

            const resultado = await res.json();
            if (resultado.success) {
                alert(`¡Procesado con éxito!\nPalabra Hex: ${resultado.hex}\nTensión Auricular: ${resultado.tension}V`);
                document.getElementById('valor').value = '';
                cargarEnvios();
            } else {
                alert('Error al procesar el envío.');
            }
        }

        function editarEnvio(id, instrumento, valor) {
            envioEnEdicion = id;
            document.getElementById('instrumento').value = instrumento;
            document.getElementById('valor').value = valor;
            document.getElementById('boton-principal').textContent = 'Guardar cambios';
            document.getElementById('cancelar-edicion').hidden = false;
            document.getElementById('instrumento').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function cancelarEdicion() {
            envioEnEdicion = null;
            document.getElementById('instrumento').value = '1 - Avisos';
            document.getElementById('valor').value = '';
            document.getElementById('boton-principal').textContent = 'Procesar y Enviar Trama';
            document.getElementById('cancelar-edicion').hidden = true;
        }

        async function eliminarEnvio(id) {
            if (confirm(`¿Estás seguro de eliminar el registro ID ${id}?`)) {
                await fetch(`/api/envios/${id}`, { method: 'DELETE' });
                if (envioEnEdicion === id) cancelarEdicion();
                cargarEnvios();
            }
        }

        cargarEnvios();
    </script>
</body>
</html>
